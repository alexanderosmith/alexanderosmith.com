  <article class="c-post"{% if include.index > site.posts_per_page %} hidden{% endif %}>
    {% if post.image %}
    <a class="c-post-thumbnail o-opacity" style="background-image: url({{"/images/" | append : post.image}})"
        href="{{post.url}}"></a>
    {% endif %}
    <div class="c-post-content">
      <h2 class="c-post-title">
        <a href="{{post.url}}">{{post.title}}</a>
      </h2>
      <p>{{ post.content | strip_html | truncatewords: 15 }}</p>
      <span class="c-post-date">{{post.date | date: '%Y, %b %d'}}&nbsp;&nbsp;&nbsp;—&nbsp;</span>
      <span class="c-post-words">{{ post.content | number_of_words | divided_by: 250 | plus: 1 }} minute read</span>
    </div>
  </article>
